# The public release: only the paths in `include` ship, built from the private repository.
# Add every new public folder here. platform/tests/test_release_list.py fails when a top-level
# folder is in neither list, or when the style checker or the prose lint does not scan it.
include = [
    "README.md",
    "LICENSE",
    "Makefile",
    "pyproject.toml",
    "uv.lock",
    ".python-version",
    ".env.example",
    ".gitignore",
    ".github/",
    "setup/",
    "section-*/",
    "final-project/",
    "slides/",
    "use-in-your-repo/",
    "guide/",
    "docs/",
    "platform/",
]
# Private tooling and its tests never ship. A test that names a private path writes it as a
# string literal, so the release build can find and drop that test too.
exclude = [
    "instructor/",
    "course-template/",
    ".claude/",
]
# Public folders whose Markdown pages are course text: the checkers must scan each one.
pages = ["setup", "section-*", "final-project", "use-in-your-repo", "guide", "docs"]
