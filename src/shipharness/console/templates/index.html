<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>shipharness console</title>
  <link rel="stylesheet" href="/static/console.css">
</head>
<body class="index">
  <header class="bar"><h1>shipharness console</h1></header>
  <main class="index-main">
    <section class="panel">
      <h2>Runs</h2>
      {% if runs %}
      <ul class="runs">
        {% for run in runs %}
        <li><a href="/run/{{ run }}">{{ run }}</a></li>
        {% endfor %}
      </ul>
      {% else %}
      <p>No runs yet. Start one with <code>make demo-1</code>.</p>
      {% endif %}
    </section>
    <section class="panel">
      <h2>Keys</h2>
      <p><kbd>1</kbd> Live Console · <kbd>2</kbd> Boards · <kbd>3</kbd> Evidence · <kbd>4</kbd> A/B Report · <kbd>5</kbd> Traces · <kbd>F</kbd> full screen for one arm</p>
    </section>
  </main>
</body>
</html>
