name: ci

# Private repository: CI minutes are limited. Push and pull requests run lint and the fast suite;
# the full suite (slow validations) and the real-container job run on manual dispatch and nightly.
# Live tests (OpenAI, LangSmith) never run in CI: no API keys are stored as GitHub secrets; run
# them locally with `make test-live`.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"  # nightly, 02:30 UTC

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/lint_prose.py
      - run: uv run python scripts/anchors.py check
      - name: import-linter (house rule R6)
        working-directory: teamtrack
        run: uv run lint-imports --config .importlinter

  fast:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - run: uv sync --frozen
      - run: uv run pytest -n auto -m "not slow and not live and not docker"

  full:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - run: uv sync --frozen
      - run: uv run pytest -n auto -m "not live and not docker"

  docker:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - run: uv sync --frozen
      - run: docker build -f sandbox/Dockerfile --target agent -t shipharness-agent:1 .
      - run: docker build -f sandbox/Dockerfile --target referee -t shipharness-referee:1 .
      - run: uv run pytest -m docker tests/unit/test_sandbox_docker.py
