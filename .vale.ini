# Optional Vale configuration. `make lint-prose` runs scripts/lint_prose.py (authoritative, same
# word list); run `vale .` as well if Vale is installed.
StylesPath = .vale/styles
MinAlertLevel = error

# Exact titles of cited sources may contain a banned word.
TokenIgnores = (Harness engineering: leveraging Codex in an agent-first world), \
  (Unlocking Efficiency in Large Language Model Inference)

[*.md]
BasedOnStyles = Shipharness
